<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>職場 AI 靈魂型態測驗</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"PingFang TC","Microsoft JhengHei",sans-serif;color:#2c3e50}
main{min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:#fff9e6;background-image:radial-gradient(#ffe3a5 1.4px,transparent 1.4px);background-size:26px 26px}
.card{width:min(620px,100%);background:#fffdf7;border:3px solid #ff8a75;border-radius:34px;padding:36px 42px;text-align:center;box-shadow:0 13px #ffc9be,0 27px 55px #bd755833}
small{display:block;color:#ff8a75;font-size:12px;font-weight:900;letter-spacing:1.5px;margin-bottom:10px}
h1,h2{margin:0;font-weight:900}
h1{font-size:clamp(28px,5vw,42px);line-height:1.3}
h1+p{font-size:17px;line-height:1.7;margin:19px 0}
.tags,mark{display:inline-block;background:#fff1c9;color:#a66032;padding:8px 14px;border-radius:50px;font-weight:800;font-size:13px;margin-bottom:25px}
button{border:0;border-radius:17px;background:#ff9f43;color:#fff;padding:16px 26px;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 6px #dc7722}
button:active{transform:translateY(4px);box-shadow:none}
i{display:block;color:#80909c;font-size:13px;font-style:normal;margin-top:22px}
.quiz{text-align:left}
.quiz header{display:flex;justify-content:space-between;color:#ff8a75;font-size:14px;font-weight:900}
.bar{height:12px;border-radius:20px;background:#ffe5d4;overflow:hidden;margin:10px 0 25px}
.bar span{display:block;height:100%;background:linear-gradient(90deg,#ff8a75,#ff9f43);border-radius:inherit}
.icon{margin:auto auto 15px;width:72px;height:72px;border-radius:25px;background:#fff1c9;display:grid;place-items:center;font-size:38px}
.quiz small{text-align:center}
.quiz h2{font-size:clamp(22px,4.5vw,29px);line-height:1.45;text-align:center;margin:8px 0 20px}
.choices{display:grid;gap:11px}
.choices button{background:#fff;color:#2c3e50;border:2px solid #ffd2c9;box-shadow:none;text-align:left;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:15px}
.choices strong{width:29px;height:29px;display:grid;place-items:center;flex:none;background:#fff1c9;color:#ff8a75;border-radius:10px;font-size:12px}
.choices b{margin-left:auto;color:#ff8a75;font-size:24px}
.result{text-align:left}
.result>small,.result>h2{text-align:center}
.result h2{font-size:clamp(25px,5vw,37px);line-height:1.25;margin:10px 0}
.result mark{display:table;margin:0 auto 19px}
.portrait{display:block;width:145px;height:145px;object-fit:contain;object-position:center;margin:8px auto 12px;padding:6px;border-radius:24px;background:#fff8e8;box-shadow:0 5px 0 #ffd2c9;border:2px solid #ff8a75}
.result article{border-top:2px dashed #ffd7ce;padding:15px 0 4px}
.result h3{color:#ff8a75;font-size:17px;margin:0 0 8px}
.result p{margin:0;line-height:1.75;font-size:15px}
.haiku{background:#fff4cf!important;border:0!important;border-radius:18px;padding:15px!important;margin-top:13px}
.haiku p{text-align:center;font-weight:800;color:#80543e}
.actions{display:flex;gap:11px;margin-top:24px}
.actions button{flex:1;font-size:15px;padding:14px 10px}
.outline{background:#fff;color:#ff8a75;border:2px solid #ff8a75;box-shadow:0 5px #ffd5ce}
@media(max-width:560px){
main{padding:16px 12px;align-items:start}
.card{padding:29px 21px;border-radius:28px;margin-top:12px}
h1+p{font-size:15px}
.choices button{font-size:14px}
.actions{flex-direction:column}
.result h2{font-size:26px}
}
</style>
</head>
<body>
<main id="app"></main>

<script>
const Q=[
['📝','主管丟來一份「麻煩潤飾一下」的 2,000 字文案，你會？',['深呼吸，自己慢慢捏字句','先改一半，再問 AI 另一半','請 AI 出三版，我負責挑可愛的','我早有專屬提示詞魔法書']],
['📊','Excel 出現 800 列資料需要整理，第一個念頭是？',['手動排序，手指會記得一切','善用篩選，至少不是全手動','請 AI 幫我寫公式，再檢查','Power Query + AI：資料自己排隊']],
['🎙️','一小時會議結束，會議紀錄在對你眨眼。你？',['憑記憶寫，祈禱沒漏重點','邊回放邊快轉，努力當人形錄音筆','丟逐字稿給 AI 摘要，人工複核','會前就開好 AI 記錄員，散會即交卷']],
['📧','同類型回信今天要發第 15 封，你的能量條？',['複製貼上，改名字改到眼神死','存範本，還是手動補內容','請 AI 依對象調整語氣','自動化流程已準備好，我去泡茶']],
['🧠','面對陌生工作任務時，你怎麼拆解？',['先 Google 三小時，勇敢前進','問同事，然後努力筆記','請 AI 協助列步驟與檢查清單','先餵背景、目標、限制，請 AI 當副駕']],
['⚙️','每週都要做同一份報表，你會？',['把它當例行修行','建立模板，至少排版不用重來','研究一下能否讓 AI 協助彙整','串好自動化，報表自己來報到']],
['🔎','AI 給了一段看起來超專業的答案，你的反應？',['好像很有道理，先貼上','挑幾句查查看','核對數字、來源和任務條件','把 AI 當草稿搭檔，驗證是我的超能力']],
['🎨','同事說：「可以把這份內容變得有吸引力嗎？」',['加粗、加色、加很多愛','找幾個舊簡報當參考','請 AI 提供結構與標題提案','先定受眾，再請 AI 產多種敘事版本']],
['🗂️','資料夾堆成「final_final_真的最終版」，你會？',['靠直覺尋寶','今天開始命名規則（明天再說）','請 AI 協助整理命名與索引','流程、標籤、摘要都自動化，舒暢']],
['✨','你理想中的 AI 同事應該是？',['偶爾幫我查資料就好','能幫我省一點打字時間','幫我先做 70% 的草稿','能被我清楚指揮的全天候小隊']]
];

const S=[
['純手工捏飯團水豚 (•̀ω•́)','你相信雙手的溫度，也真的把每份文件捏得很仔細。AI 對你來說像辦公室角落那台還沒拆膜的神秘機器。','從「請幫我把這段改得更清楚」開始。一次只交一個小任務給 AI，保留你的細心，偷一點時間。'],
['複製貼上小倉鼠 (🐹•ω•)','你已發展出高速搬運技能：同一句話可以安穩住進 12 封信。可愛，但手腕表示它想放假。','把常用回覆交給 AI 變成 3 種語氣範本，再用變數替換姓名與日期。'],
['公式迷路小企鵝 (•ㅅ•)','你和 Excel 的關係像在雪地探險：偶爾找到寶藏，偶爾一格公式就讓你滑倒。','把欄位與期望結果貼給 AI，請它解釋公式每一段在做什麼，不只拿答案。'],
['會議筆記章魚燒 (˶ᵔ ᵕ ᵔ˶)','你有好多觸手在記重點，散會後卻發現漏了一顆重要章魚。忙得熱呼呼，仍然很可靠。','先開逐字稿，請 AI 依「決策／待辦／負責人／期限」輸出，最後花 2 分鐘校對。'],
['提示詞練習生兔兔 (ᐢ.ˬ.ᐢ)','你已經會問 AI 問題，也知道不同問法會召喚不同魔法。現在正在長出專屬的小耳朵雷達。','每次加上三件事：角色、背景、輸出格式。'],
['自動化探險小浣熊 (✦ˊᵕˋ✦)','重複工作一出現，你的鼻子就聞到「這可以省力」的味道。你正在收集讓日子更鬆的零件。','挑一個每週重複任務，畫出「觸發→整理→輸出」三步，先讓 AI 幫你設計最小自動化。'],
['資料整理貓頭鷹 (◉ᴗ◉)','你不是只求快；你會檢查來源、梳理脈絡，還能在雜亂資料裡叼出真正的重點。','建立 AI 交稿檢查清單：數字、日期、專名、語氣、附件。'],
['流程魔法小狐狸 (ᵔᴥᵔ)','你已經懂得把 AI 放進工作流程，不讓它搶方向盤。敏捷又有邊界感，是團隊的暖心魔法師。','把最成功的提示詞存成團隊範本，附上何時使用與如何驗證。'],
['AI 協作雲朵精靈 (☁️˘͈ᵕ˘͈)','你的工作像有一片雲在托著：腦暴、初稿、分類、摘要都有人分擔。','練習多輪協作：先請 AI 提案，再要求它自我挑錯，最後由你決定取捨。'],
['ChatGPT Work 降臨神仙貓 (ฅ^•ﻌ•^ฅ)','恭喜，你是職場 AI 的溫柔指揮官！你不把 AI 當許願池，而是清楚分工的好隊友。','為常見任務建立可重複工作流，並分享你的驗證習慣。你會讓團隊整片魚罐頭都自動開好。']
];

const H=['提示詞下對｜準時下班吃火鍋｜AI 萬歲','Excel 壞掉｜側邊欄裡問一聲｜秒修好過關','會議剛散場｜逐字稿已排成隊｜咖啡還溫','信件排長龍｜AI 幫我穿針線｜寄出小星星','報表像海浪｜公式撐起小雨傘｜準點到岸邊','老闆說快點｜我說正在想辦法｜其實問 AI','複製貼上忙｜小倉鼠轉著滾輪｜終於有範本','檔名最終版｜最終版真的最終｜雲端在微笑','提示詞一改｜語氣忽然有靈魂｜客戶點點頭','資料很凌亂｜貓頭鷹眨眨眼睛｜重點飛出來'];

const CHARACTERS=['capybara-riceball.png','hamster-copy.png','penguin-excel.png','takoyaki-notes.png','bunny-prompt.png','raccoon-automation.png','owl-data.png','fox-workflow.png','cloud-fairy.png','divine-ai-cat.png'];

let page=0,p=0,score=0,h=H[0];
const app=document.querySelector('#app');
const characterIndex=()=>Math.min(9,Math.max(0,Math.floor((score-10)/10)));
const characterSrc=n=>`characters/${CHARACTERS[n]}`;

function start(){
  page=1;p=0;score=0;render();
}

function pick(i){
  score+=[1,3,6,10][i];
  if(p===9){
    h=H[Math.floor(Math.random()*H.length)];
    page=2;
  }else{
    p++;
  }
  render();
}

function save(){
  const s=S[characterIndex()];
  const c=document.createElement('canvas');
  const x=c.getContext('2d');
  c.width=1080;
  c.height=1350;

  const wrapLines=(text,maxWidth,font)=>{
    x.font=font;
    let line='',lines=[];
    for(const ch of text){
      if(x.measureText(line+ch).width>maxWidth&&line){
        lines.push(line);
        line=ch;
      }else{
        line+=ch;
      }
    }
    if(line)lines.push(line);
    return lines;
  };

  const drawText=(text,left,top,maxWidth,font,color,lineHeight)=>{
    const lines=wrapLines(text,maxWidth,font);
    x.font=font;
    x.fillStyle=color;
    x.textAlign='left';
    lines.forEach((line,index)=>x.fillText(line,left,top+index*lineHeight));
    return lines.length*lineHeight;
  };

  x.fillStyle='#f7efe8';
  x.fillRect(0,0,1080,1350);

  x.fillStyle='#e97d70';
  x.fillRect(0,0,24,1350);

  x.fillStyle='#fffcf8';
  x.beginPath();
  x.roundRect(55,45,970,1260,44);
  x.fill();

  x.fillStyle='#f7d9c8';
  x.beginPath();
  x.roundRect(100,105,214,42,21);
  x.fill();

  x.fillStyle='#9a4c44';
  x.font='bold 18px sans-serif';
  x.textAlign='center';
  x.fillText('WORKPLACE AI SOUL',207,133);

  x.fillStyle='#354052';
  x.font='bold 28px sans-serif';
  x.textAlign='left';
  x.fillText('你的職場 AI 靈魂鑑定卡',100,205);

  x.fillStyle='#b56b5d';
  x.font='22px sans-serif';
  x.fillText('把你的工作風格，好好收藏起來。',100,244);

  x.fillStyle='#e97d70';
  x.fillRect(100,282,880,3);

  const titleLines=wrapLines(s[0],820,'bold 48px sans-serif');
  x.font='bold 48px sans-serif';
  x.fillStyle='#253247';
  x.textAlign='center';
  titleLines.forEach((line,index)=>x.fillText(line,540,365+index*58));

  const titleBottom=365+(titleLines.length-1)*58;

  x.fillStyle='#fff0c8';
  x.beginPath();
  x.roundRect(365,titleBottom+38,350,58,29);
  x.fill();

  x.fillStyle='#a5663c';
  x.font='bold 23px sans-serif';
  x.fillText('AI 共感指數　'+Math.min(100,score)+'%',540,titleBottom+76);

  let y=titleBottom+145;

  const section=(label,body,tint)=>{
    const height=Math.max(158,84+wrapLines(body,760,'25px sans-serif').length*38);

    x.fillStyle=tint;
    x.beginPath();
    x.roundRect(100,y,880,height,30);
    x.fill();

    x.fillStyle='#c9675b';
    x.font='bold 25px sans-serif';
    x.textAlign='left';
    x.fillText(label,140,y+44);

    drawText(body,140,y+87,760,'25px sans-serif','#354052',38);
    y+=height+24;
  };

  section('01　性格與職場現況',s[1],'#fff3ec');
  section('02　職場開運解藥',s[2],'#fff8dd');

  x.fillStyle='#354052';
  x.beginPath();
  x.roundRect(100,y,880,160,30);
  x.fill();

  x.fillStyle='#ffd37a';
  x.font='bold 23px sans-serif';
  x.textAlign='left';
  x.fillText("TODAY'S AI HAIKU",140,y+47);

  x.fillStyle='#fff';
  x.font='bold 29px sans-serif';
  x.textAlign='center';
  x.fillText(h.split('｜').join('　／　'),540,y+105);

  x.fillStyle='#c9675b';
  x.font='20px sans-serif';
  x.fillText('WORK SMART · STAY CURIOUS · BE YOU',540,1235);

  const a=document.createElement('a');
  a.href=c.toDataURL('image/png');
  a.download='我的職場AI靈魂.png';
  a.click();
}

function render(){
  const s=S[characterIndex()];

  if(page===0){
    app.innerHTML=`
      <section class="card">
        <div style="font-size:70px;margin-bottom:12px">🤖🐾</div>
        <small>WORKPLACE AI SOUL CHECK</small>
        <h1>職場 AI 靈魂型態測驗<br>(⁠*⁠´⁠ω⁠｀⁠*)</h1>
        <p>你是勤奮打字小魔王，還是 AI 甩手大掌櫃？<br>10 秒測出你的職場 AI 基因✨</p>
        <div class="tags">文字處理　Excel　自動化</div><br>
        <button onclick="start()">開始測驗　➜</button>
        <i>共 10 題 · 跟著直覺選就好喵！</i>
      </section>`;
    return;
  }

  if(page===1){
    app.innerHTML=`
      <section class="card quiz">
        <header>Question ${p+1}/10 🐾 <b>${(p+1)*10}%</b></header>
        <div class="bar"><span style="width:${(p+1)*10}%"></span></div>
        <div class="icon">${Q[p][0]}</div>
        <small>職場情境快問快答</small>
        <h2>${Q[p][1]}</h2>
        <div class="choices">
          ${Q[p][2].map((v,i)=>`
            <button onclick="pick(${i})">
              <strong>${'ABCD'[i]}</strong>${v}<b>›</b>
            </button>`).join('')}
        </div>
        <i>選最像你的那一項，沒有標準答案！</i>
      </section>`;
    return;
  }

  app.innerHTML=`
    <section class="card result">
      <small>✨ 你的職場 AI 靈魂是 ✨</small>
      <h2>${s[0]}</h2>
      <img class="portrait" src="${characterSrc(characterIndex())}" alt="你的 AI 靈魂角色">
      <mark>AI 共感指數 ${Math.min(100,score)}%</mark>
      <article>
        <h3>🧠 性格與職場現況</h3>
        <p>${s[1]}</p>
      </article>
      <article>
        <h3>💊 職場開運解藥</h3>
        <p>${s[2]}</p>
      </article>
      <article class="haiku">
        <h3>⛩️ 今日 AI 俳句</h3>
        <p>${h.split('｜').join(' ／ ')}</p>
      </article>
      <div class="actions">
        <button class="outline" onclick="save()">🖼️ 匯出分享圖</button>
        <button onclick="start()">再測一次 ↻</button>
      </div>
      <i>把結果分享給同事，召喚他們的 AI 小怪獸！</i>
    </section>`;
}

render();
</script>
</body>
</html>
