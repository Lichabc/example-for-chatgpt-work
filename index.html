const Q=[['📝','主管丟來一份「麻煩潤飾一下」的 2,000 字文案，你會？',['深呼吸，自己慢慢捏字句','先改一半，再問 AI 另一半','請 AI 出三版，我負責挑可愛的','我早有專屬提示詞魔法書']],['📊','Excel 出現 800 列資料需要整理，第一個念頭是？',['手動排序，手指會記得一切','善用篩選，至少不是全手動','請 AI 幫我寫公式，再檢查','Power Query + AI：資料自己排隊']],['🎙️','一小時會議結束，會議紀錄在對你眨眼。你？',['憑記憶寫，祈禱沒漏重點','邊回放邊快轉，努力當人形錄音筆','丟逐字稿給 AI 摘要，人工複核','會前就開好 AI 記錄員，散會即交卷']],['📧','同類型回信今天要發第 15 封，你的能量條？',['複製貼上，改名字改到眼神死','存範本，還是手動補內容','請 AI 依對象調整語氣','自動化流程已準備好，我去泡茶']],['🧠','面對陌生工作任務時，你怎麼拆解？',['先 Google 三小時，勇敢前進','問同事，然後努力筆記','請 AI 協助列步驟與檢查清單','先餵背景、目標、限制，請 AI 當副駕']],['⚙️','每週都要做同一份報表，你會？',['把它當例行修行','建立模板，至少排版不用重來','研究一下能否讓 AI 協助彙整','串好自動化，報表自己來報到']],['🔎','AI 給了一段看起來超專業的答案，你的反應？',['好像很有道理，先貼上','挑幾句查查看','核對數字、來源和任務條件','把 AI 當草稿搭檔，驗證是我的超能力']],['🎨','同事說：「可以把這份內容變得有吸引力嗎？」',['加粗、加色、加很多愛','找幾個舊簡報當參考','請 AI 提供結構與標題提案','先定受眾，再請 AI 產多種敘事版本']],['🗂️','資料夾堆成「final_final_真的最終版」，你會？',['靠直覺尋寶','今天開始命名規則（明天再說）','請 AI 協助整理命名與索引','流程、標籤、摘要都自動化，舒暢']],['✨','你理想中的 AI 同事應該是？',['偶爾幫我查資料就好','能幫我省一點打字時間','幫我先做 70% 的草稿','能被我清楚指揮的全天候小隊']]];

const S=[['純手工捏飯團水豚 (•̀ω•́)','你相信雙手的溫度，也真的把每份文件捏得很仔細。AI 對你來說像辦公室角落那台還沒拆膜的神秘機器。','從「請幫我把這段改得更清楚」開始。一次只交一個小任務給 AI，保留你的細心，偷一點時間。'],['複製貼上小倉鼠 (🐹•ω•)','你已發展出高速搬運技能：同一句話可以安穩住進 12 封信。可愛，但手腕表示它想放假。','把常用回覆交給 AI 變成 3 種語氣範本，再用變數替換姓名與日期。'],['公式迷路小企鵝 (•ㅅ•)','你和 Excel 的關係像在雪地探險：偶爾找到寶藏，偶爾一格公式就讓你滑倒。','把欄位與期望結果貼給 AI，請它解釋公式每一段在做什麼，不只拿答案。'],['會議筆記章魚燒 (˶ᵔ ᵕ ᵔ˶)','你有好多觸手在記重點，散會後卻發現漏了一顆重要章魚。忙得熱呼呼，仍然很可靠。','先開逐字稿，請 AI 依「決策／待辦／負責人／期限」輸出，最後花 2 分鐘校對。'],['提示詞練習生兔兔 (ᐢ.ˬ.ᐢ)','你已經會問 AI 問題，也知道不同問法會召喚不同魔法。現在正在長出專屬的小耳朵雷達。','每次加上三件事：角色、背景、輸出格式。'],['自動化探險小浣熊 (✦ˊᵕˋ✦)','重複工作一出現，你的鼻子就聞到「這可以省力」的味道。你正在收集讓日子更鬆的零件。','挑一個每週重複任務，畫出「觸發→整理→輸出」三步，先讓 AI 幫你設計最小自動化。'],['資料整理貓頭鷹 (◉ᴗ◉)','你不是只求快；你會檢查來源、梳理脈絡，還能在雜亂資料裡叼出真正的重點。','建立 AI 交稿檢查清單：數字、日期、專名、語氣、附件。'],['流程魔法小狐狸 (ᵔᴥᵔ)','你已經懂得把 AI 放進工作流程，不讓它搶方向盤。敏捷又有邊界感，是團隊的暖心魔法師。','把最成功的提示詞存成團隊範本，附上何時使用與如何驗證。'],['AI 協作雲朵精靈 (☁️˘͈ᵕ˘͈)','你的工作像有一片雲在托著：腦暴、初稿、分類、摘要都有人分擔。','練習多輪協作：先請 AI 提案，再要求它自我挑錯，最後由你決定取捨。'],['ChatGPT Work 降臨神仙貓 (ฅ^•ﻌ•^ฅ)','恭喜，你是職場 AI 的溫柔指揮官！你不把 AI 當許願池，而是清楚分工的好隊友。','為常見任務建立可重複工作流，並分享你的驗證習慣。你會讓團隊整片魚罐頭都自動開好。']];

const H=['提示詞下對｜準時下班吃火鍋｜AI 萬歲','Excel 壞掉｜側邊欄裡問一聲｜秒修好過關','會議剛散場｜逐字稿已排成隊｜咖啡還溫','信件排長龍｜AI 幫我穿針線｜寄出小星星','報表像海浪｜公式撐起小雨傘｜準點到岸邊','老闆說快點｜我說正在想辦法｜其實問 AI','複製貼上忙｜小倉鼠轉著滾輪｜終於有範本','檔名最終版｜最終版真的最終｜雲端在微笑','提示詞一改｜語氣忽然有靈魂｜客戶點點頭','資料很凌亂｜貓頭鷹眨眨眼睛｜重點飛出來','月報又來了｜自動化按下按鈕｜午後有空閒','表格排整齊｜AI 偷偷擦桌面｜我喝一口茶','腦暴到深夜｜雲朵吐出十點子｜挑一顆發光','附件忘記放｜AI 沒有提醒我｜人類要檢查','期限在奔跑｜狐狸畫好流程圖｜尾巴不著火','十頁的逐字｜濃縮成三行待辦｜會議變輕盈','程式碼怕我｜我先請 AI 翻譯｜勇敢按儲存','數字會說話｜先把來源查一遍｜安心按送出','客戶改三次｜提示詞也伸懶腰｜第四版可愛','週一的早晨｜AI 先煮好草稿｜我加一點鹽','表單像迷宮｜小浣熊拉起絲線｜資料自己來','KPI 閃閃亮｜不是魔法是整理｜還有一點肝','滑鼠點太久｜快捷鍵與 AI 說｜手腕謝謝你','內容要新鮮｜先給受眾和情境｜靈感冒泡泡','資料不確定｜神仙貓拿放大鏡｜引用要驗證','午餐前十分｜自動寄出週報了｜便當加雞腿','簡報要好看｜AI 排好故事線｜我來講人味','任務像積木｜拆成三塊丟出去｜焦慮變小顆','今天學一招｜明天少按五十下｜職場開小花','答案雖漂亮｜還是核對小數點｜專業最可愛'];
const CHARACTERS=['capybara-riceball.png','hamster-copy.png','penguin-excel.png','takoyaki-notes.png','bunny-prompt.png','raccoon-automation.png','owl-data.png','fox-workflow.png','cloud-fairy.png','divine-ai-cat.png'];
const characterIndex=()=>Math.min(9,Math.max(0,Math.floor((score-10)/10)));
const characterSrc=n=>`characters/${CHARACTERS[n]}`;
const characterCache=new Map();
const loadCharacter=src=>{const absoluteSrc=new URL(src,document.baseURI).href;if(!characterCache.has(absoluteSrc)){const imagePromise=fetch(absoluteSrc).then(response=>{if(!response.ok)throw new Error('圖片下載失敗');return response.blob()}).then(blob=>new Promise((resolve,reject)=>{const image=new Image(),blobUrl=URL.createObjectURL(blob);image.onload=()=>resolve(image);image.onerror=()=>{URL.revokeObjectURL(blobUrl);reject(new Error('圖片載入失敗'))};image.src=blobUrl}));characterCache.set(absoluteSrc,imagePromise);imagePromise.catch(()=>characterCache.delete(absoluteSrc));}return characterCache.get(absoluteSrc)};
const preloadCharacters=Promise.allSettled(CHARACTERS.map((_,n)=>loadCharacter(characterSrc(n))));
let page=0,p=0,score=0,h=H[0];
const app=document.querySelector('#app');
const start=()=>{page=1;
p=0;
score=0;
render()};
const pick=i=>{score+=[1,3,6,10][i];
if(p===9){h=H[Math.floor(Math.random()*H.length)];
page=2}else p++;
render()};
const drawImageContain=(ctx,image,x,y,width,height)=>{const scale=Math.min(width/image.naturalWidth,height/image.naturalHeight),drawWidth=image.naturalWidth*scale,drawHeight=image.naturalHeight*scale;ctx.drawImage(image,x+(width-drawWidth)/2,y+(height-drawHeight)/2,drawWidth,drawHeight)};
const save=async()=>{const n=characterIndex(),s=S[n],c=document.createElement('canvas'),x=c.getContext('2d');let img;
c.width=1080;
c.height=1350;
const drawCard=()=>{x.fillStyle='#FFF9E6';
x.fillRect(0,0,1080,1350);
x.fillStyle='#FF8A75';
x.beginPath();
x.arc(980,100,220,0,Math.PI*2);
x.fill();
x.fillStyle='#FFE2A8';
x.beginPath();
x.arc(95,1220,210,0,Math.PI*2);
x.fill();
x.fillStyle='#fffdf7';
x.roundRect(60,55,960,1240,52);
x.fill();
x.fillStyle='#FF8A75';
x.font='bold 27px sans-serif';
x.fillText('✦ WORKPLACE AI SOUL CHECK ✦',130,130);
x.save();
x.beginPath();
x.arc(540,300,136,0,Math.PI*2);
x.clip();
drawImageContain(x,img,404,164,272,272);
x.restore();
x.lineWidth=10;
x.strokeStyle='#FF9F43';
x.beginPath();
x.arc(540,300,140,0,Math.PI*2);
x.stroke();
x.fillStyle='#2C3E50';
x.textAlign='center';
x.font='bold 42px sans-serif';
x.fillText(s[0],540,500);
x.fillStyle='#FFF1C9';
x.roundRect(385,530,310,48,24);
x.fill();
x.fillStyle='#A66032';
x.font='bold 21px sans-serif';
x.fillText('AI 共感指數  '+Math.min(100,score)+'%',540,562);
x.textAlign='left';
const wrap=(text,y)=>{x.font='28px sans-serif';
x.fillStyle='#2C3E50';
let line='',yy=y;
for(const ch of text){if(x.measureText(line+ch).width>720){x.fillText(line,180,yy);
line=ch;
yy+=43}else line+=ch}x.fillText(line,180,yy);
return yy};
let y=670;
[['🧠 性格與職場現況',s[1]],['💊 職場開運解藥',s[2]]].forEach(([t,body])=>{x.fillStyle='#FF8A75';
x.font='bold 25px sans-serif';
x.fillText(t,180,y);
y=wrap(body,y+48)+75});
x.fillStyle='#FFF1C9';
x.roundRect(145,y-25,790,155,28);
x.fill();
x.fillStyle='#FF8A75';
x.font='bold 25px sans-serif';
x.fillText('⛩️ 今日 AI 俳句',180,y+18);
x.fillStyle='#2C3E50';
x.font='bold 28px sans-serif';
x.textAlign='center';
x.fillText(h.split('｜').join(' ／ '),540,y+78);
x.fillStyle='#FF9F43';
x.font='22px sans-serif';
x.fillText('測測你的職場 AI 小怪獸！ (ฅ´ω`ฅ)',540,1235);
const a=document.createElement('a');
a.href=c.toDataURL('image/png');
a.download='我的職場AI靈魂.png';
a.click()};
try{img=await loadCharacter(characterSrc(n));drawCard()}catch(e){alert('角色圖片載入失敗，請確認「characters」資料夾與 index.html 放在同一個資料夾中。')}};
function render(){let s=S[Math.min(9,Math.max(0,Math.floor((score-10)/10)))];
app.innerHTML='<div class="stars">✦　☁　✧</div>'+(!page?`<section class="card start"><div class="hero">🤖🐾</div><small>WORKPLACE AI SOUL CHECK</small><h1>職場 AI 靈魂型態測驗<br/>(⁠*⁠´⁠ω⁠｀⁠*⁠)</h1><p>你是勤奮打字小魔王，還是 AI 甩手大掌櫃？<br/>10 秒測出你的職場 AI 基因✨</p><div class="tags">文字處理　Excel　自動化</div><br><button onclick="start()">開始測驗　➜</button><i>共 10 題 · 跟著直覺選就好喵！/ 旗標知識講堂 x ChatGPT Work 出品(•̀ω•́)⸝ި ʕᦏ⌎ </i>
</section>`:page===1?`<section class="card quiz"><header>Question ${p+1}/10 🐾 <b>${(p+1)*10}%</b>
</header><div class="bar"><span style="width:${(p+1)*10}%">
</span>
</div><div class="icon">${Q[p][0]}</div><small>職場情境快問快答</small><h2>${Q[p][1]}</h2><div class="choices">${Q[p][2].map((v,i)=>`<button onclick="pick(${i})"><strong>${'ABCD'[i]}</strong>${v}<b>›</b>
</button>`).join('')}</div><i>選最像你的那一項，沒有標準答案！</i>
</section>`:`<section class="card result"><small>✨ 你的職場 AI 靈魂是 ✨</small><h2>${s[0]}</h2>
<img class="portrait" src="${characterSrc(characterIndex())}" alt="你的 AI 靈魂角色">
<mark>AI 共感指數 ${Math.min(100,score)}%</mark><article><h3>🧠 性格與職場現況</h3><p>${s[1]}</p>
</article><article><h3>💊 職場開運解藥</h3><p>${s[2]}</p>
</article><article class="haiku"><h3>⛩️ 今日 AI 俳句</h3><p>${h.split('｜').join(' ／ ')}</p>
</article><div class="actions"><button class="outline" onclick="save()">🖼️ 匯出分享圖</button><button onclick="start()">再測一次 ↻</button>
</div><i>把結果分享給同事，召喚他們的 AI 小怪獸！</i>
</section>`)}render();
